<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Ordering Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #c0392b;
        }

        h2 {
            color: #333;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 10px 0;
        }

        input, textarea {
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        button {
            background-color: #c0392b;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #922b21;
        }

        .order-details {
            background-color: #f9e6e3;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Pizza Ordering Page</h1>
    <p>Choose your pizza and place your order!</p>

    <form>

        <div class="section">
            <h2>1. Choose Pizza Size</h2>

            <label>
                <input type="radio" name="size" value="Small">
                Small - $10
            </label>

            <label>
                <input type="radio" name="size" value="Medium">
                Medium - $13
            </label>

            <label>
                <input type="radio" name="size" value="Large">
                Large - $16
            </label>
        </div>

        <div class="section">
            <h2>2. Choose Toppings</h2>

            <label>
                <input type="checkbox" name="toppings" value="Pepperoni">
                Pepperoni - $2
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Mushrooms">
                Mushrooms - $1
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Extra Cheese">
                Extra Cheese - $2
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Olives">
                Olives - $1
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Sausage">
                Sausage - $2
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Bacon">
                Bacon - $2
            </label>
        </div>

        <div class="section">
            <h2>3. Customer Information</h2>

            <label>
                Name:
                <input type="text" name="customerName" placeholder="Enter your name">
            </label>

            <label>
                Email:
                <input type="email" name="email" placeholder="Enter your email">
            </label>

            <label>
                Phone:
                <input type="tel" name="phone" placeholder="Enter your phone">
            </label>

            <label>
                Address:
                <input type="text" name="address" placeholder="Enter your address">
            </label>

            <label>
                Notes:
                <textarea name="notes" rows="4" placeholder="Special instructions..."></textarea>
            </label>
        </div>

        <div class="section order-details">
            <h2>4. Order Details</h2>

            <p>Number of Pizzas: 1</p>
            <p>Selected Size: Not selected</p>
            <p>Selected Toppings: None</p>
            <p>Total Price: $0.00</p>
        </div>

        <button type="submit">Place Order</button>

    </form>

</div>

</body>
</html>
