<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop Assignment</title>
</head>
<body>

    <h1>For Loop Assignment</h1>

    <h2>1. List of Numbers</h2>
    <div id="numbers"></div>

    <h2>2. Multiplication Table</h2>
    <table id="table" border="1"></table>

    <script>
        let numbers = "";

        for (let i = 1; i <= 12; i++) {
            numbers += i + " ";
        }

        document.getElementById("numbers").innerHTML = numbers;
        let table = "";

        for (let i = 1; i <= 12; i++) {
            table += "<tr>";

            for (let j = 1; j <= 12; j++) {
                table += "<td>" + (i * j) + "</td>";
            }

            table += "</tr>";
        }

        document.getElementById("table").innerHTML = table;
    </script>

</body>
</html>
