<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple List Manager</title>
</head>
<body>

<h1>Simple List Manager</h1>

<h2>My List</h2>
<ul id="list"></ul>
<input type="text" id="itemInput" placeholder="Enter an item">
<button onclick="addItem()">Add</button>
<button onclick="removeItem()">Remove Last Item</button>
<button onclick="sortList()">Sort</button>

<script>
    let items = ["Phone", "Table", "Pen", "Car", "Keyboard"];

    function displayList() {
        let listHTML = "";

        for (let item of items) {
            listHTML += "<li>" + item + "</li>";
        }

        document.getElementById("list").innerHTML = listHTML;
    }
    function addItem() {
        let input = document.getElementById("itemInput");
        let newItem = input.value.trim();

        if (newItem !== "") {
            items.push(newItem);
            input.value = "";
            displayList();
        }
    }

    function removeItem() {
        items.pop();
        displayList();
    }

    function sortList() {
        items.sort();
        displayList();
    }

    displayList();
</script>
</body>
</html>
